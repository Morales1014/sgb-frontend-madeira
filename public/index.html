<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>SGB - Universidad de Madeira</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #0288d1;
      color: white;
    }
  </style>
</head>

<body>
  <h1>Sistema de Gestión Bibliotecaria (SGB)</h1>
  <h2>Recursos Registrados (Python + Supabase Cloud)</h2>

  <table id="tabla-recursos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>ISBN</th>
        <th>Colección</th>
        <th>Días Máx. Préstamo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API_URL = 'http://localhost:4000/api/recursos';

    async function cargarRecursosEndToEnd() {
      try {
        const response = await fetch(API_URL);
        const json = await response.json();

        const tbody = document.querySelector('#tabla-recursos tbody');
        tbody.innerHTML = '';

        json.data.forEach(item => {
          const row = `<tr>
            <td>${item.id}</td>
            <td>${item.titulo}</td>
            <td>${item.isbn}</td>
            <td>${item.coleccion}</td>
            <td>${item.diasPrestamoMax} días</td>
          </tr>`;
          tbody.innerHTML += row;
        });
      } catch (error) {
        console.error("Error realizando la conexión End-to-End:", error);
      }
    }

    window.onload = cargarRecursosEndToEnd;
  </script>
</body>

</html>
